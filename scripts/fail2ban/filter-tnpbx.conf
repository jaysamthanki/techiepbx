# Fail2ban filter for TNPBX: Asterisk PJSIP security events.
#
# Asterisk (res_security_log) writes one line per security event to
# /var/log/asterisk/security.log in the shape:
#
#   [2026-09-22 00:12:25.811] SECURITY[34846] res_security_log.c: SecurityEvent="ChallengeSent",
#     EventTV="...", Severity="Informational", Service="PJSIP", EventVersion="1",
#     AccountID="104", SessionID="...", LocalAddress="IPV4/UDP/198.51.100.7/5060",
#     RemoteAddress="IPV4/UDP/203.0.113.25/33988", ...
#
# Only the failure events count as a brute-force attempt. SuccessfulAuth and
# ChallengeSent are the normal handshake noise of every REGISTER and must
# never match, or every healthy phone would eventually ban itself.

[INCLUDES]
before = common.conf

[Definition]
_daemon = res_security_log

# The address sits inside RemoteAddress="IPV4/UDP/<ip>/<port>", so the filter
# captures it with <HOST> right after the transport prefix; the port and the
# closing quote are left unconsumed.
failregex = ^.*SecurityEvent="(?:InvalidPassword|InvalidAccountID|ChallengeResponseFailed|FailedACL)".*RemoteAddress="IPV4/UDP/<HOST>/

ignoreregex =

# Timestamps are bracketed, e.g. [2026-09-22 00:12:25.811]. In fail2ban
# config, % is interpolated, so strftime placeholders are written as %%.
datepattern = ^\[%%Y-%%m-%%d %%H:%%M:%%S(?:[.,]%%f)?\]

# Author: TNPBX project, piece 20 (D7: fail2ban first, own blocker later)