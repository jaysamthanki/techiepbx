# TNPBX: the directory the privileged helper's Unix socket lives in (D142).
#
# 0750 root:tnpbx, so only the web application's group can so much as look inside it. That is
# defence in depth and not the authentication: what actually decides who may talk to the helper
# is the SO_PEERCRED check on every connection.
#
# The helper's unit also declares RuntimeDirectory=tnpbx and re-asserts owner and mode itself at
# startup. This entry is what puts the directory there at boot, before anything has started.
d /run/tnpbx 0750 root tnpbx -
