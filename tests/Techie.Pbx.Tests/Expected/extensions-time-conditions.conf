[tc-1]
; Office hours: the open/closed check, reached by the Goto on 600 in [internal].
; Nothing is included here, so a caller can never fall through to a route out.
; The hours below are LOCAL time in Europe/London: every GotoIfTime names that zone as
; its last argument, so Asterisk evaluates it there, daylight saving included.
; The server's own clock is UTC and is not what these are matched against (D74).
exten => s,1,Answer()
 same => n,NoOp(Time condition 600 Office hours)

; Holidays are checked first and win over the open hours. A GotoIfTime date
; has no year in it, so each of these comes round every year (D64).
 same => n,GotoIfTime(*,*,1,jan,Europe/London?h1)
 same => n,GotoIfTime(*,*,4,jul,Europe/London?holiday)
 same => n,GotoIfTime(*,*,25,dec,Europe/London?holiday)

; Open hours
 same => n,GotoIfTime(09:00-17:00,mon-fri,*,*,Europe/London?open)
 same => n,GotoIfTime(09:00-12:30,sat,*,*,Europe/London?open)

 same => n(closed),NoOp(Time condition 600 closed to TimeCondition:601)
 same => n,Goto(internal,601,1)

 same => n(open),NoOp(Time condition 600 open to Extension:1001)
 same => n,Goto(internal,1001,1)

 same => n(holiday),NoOp(Time condition 600 holiday to Announcement:700)
 same => n,Goto(internal,700,1)

 same => n(h1),NoOp(Time condition 600 holiday 1 jan to Hangup)
 same => n,Hangup()

