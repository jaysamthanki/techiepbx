[internal]
; Echo test
exten => *43,1,Answer()
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Hangup()

; Directed call pickup: the code above followed by the extension that is ringing
exten => _*8.,1,Pickup(${EXTEN:2}@internal)
 same => n,Hangup()

; Calls to the outside world, tried in the order the routes are listed
include => outbound

[from-trunk-callcentric]
; Inbound calls from the callcentric trunk
; The provider puts the account user in the request URI and the DID in the To
; header (verified on the wire, matching Callcentric's DID-routing guide), so
; every call lands on one pattern and is dispatched by the number it was sent to.
exten => _X.,1,Set(DID=${CUT(CUT(PJSIP_HEADER(read,To),@,1),:,2)})
 same => n,NoOp(Inbound ${DID} on callcentric)
 same => n(none),NoOp(No inbound route for ${DID} on callcentric)
 same => n,Hangup()

[outbound]
include => outbound-local
include => outbound-nine-out
include => outbound-blocked

[outbound-local]
; local (10) out over callcentric
exten => _NXXXXXX,1,Dial(PJSIP/callcentric/sip:1714${EXTEN}@callcentric.com,60,tTkK)
 same => n,Hangup()

[outbound-nine-out]
; nine-out (20) out over callcentric
exten => _9NXXXXXXXXX,1,Dial(PJSIP/callcentric/sip:1${EXTEN:1}@callcentric.com,60,tTkK)
 same => n,Hangup()

[outbound-blocked]
; No route matched, so the call does not go out. Toll fraud starts with a
; number nobody meant to allow, so unmatched numbers fail here on purpose.
exten => _X.,1,NoOp(No outbound route for ${EXTEN})
 same => n,Playback(ss-noservice)
 same => n,Hangup()
