[internal]
; Echo test
exten => *43,1,Answer()
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Hangup()

; Check your own voicemail
exten => *97,1,Answer()
 same => n,VoiceMailMain(${CALLERID(num)}@default,s)
 same => n,Hangup()

; Call parking. Press *3 during a call to park it; the system says which
; slot it went into. Dial that slot number from any phone to pick it up.
; An unclaimed call rings back the phone that parked it after 60s (D119).
; Each slot carries a hint as well, so a phone key can watch it: park:N@<context>
; is the device state res_parking publishes for the lot, and it is lit while a
; call is sitting there (D121).
exten => 1,hint,park:1@parkedcalls
exten => 1,1,ParkedCall(default,1)
 same => n,Hangup()
exten => 2,hint,park:2@parkedcalls
exten => 2,1,ParkedCall(default,2)
 same => n,Hangup()

; Night mode (call flow control): dial *28 to switch it on or off. The key lamp is lit while on.
exten => *28,hint,Custom:tnpbx-cfc-1
exten => *28,1,Answer()
 same => n,GotoIf($["${DB(TNPBX/CFC/1)}" = "1"]?off)
 same => n,Set(DB(TNPBX/CFC/1)=1)
 same => n,Set(DEVICE_STATE(Custom:tnpbx-cfc-1)=INUSE)
 same => n,Playback(activated)
 same => n,Hangup()
 same => n(off),Set(DB(TNPBX/CFC/1)=0)
 same => n,Set(DEVICE_STATE(Custom:tnpbx-cfc-1)=NOT_INUSE)
 same => n,Playback(de-activated)
 same => n,Hangup()

; Lunch (call flow control): dial *271 to switch it on or off. The key lamp is lit while on.
exten => *271,hint,Custom:tnpbx-cfc-2
exten => *271,1,Answer()
 same => n,GotoIf($["${DB(TNPBX/CFC/2)}" = "1"]?off)
 same => n,Set(DB(TNPBX/CFC/2)=1)
 same => n,Set(DEVICE_STATE(Custom:tnpbx-cfc-2)=INUSE)
 same => n,Playback(activated)
 same => n,Hangup()
 same => n(off),Set(DB(TNPBX/CFC/2)=0)
 same => n,Set(DEVICE_STATE(Custom:tnpbx-cfc-2)=NOT_INUSE)
 same => n,Playback(de-activated)
 same => n,Hangup()

; Directed call pickup: the code above followed by the extension that is ringing
exten => _*8.,1,Pickup(${EXTEN:2}@internal)
 same => n,Hangup()

; Front Desk
exten => 1001,hint,PJSIP/1001
exten => 1001,1,Dial(PJSIP/1001,30,tTkKr)
 same => n,Hangup()

; Sales
exten => 1002,hint,PJSIP/1002
exten => 1002,1,Dial(PJSIP/1002,30,tTkKr)
 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?busy:unavailable)
 same => n(busy),VoiceMail(1002@default,b)
 same => n,Hangup()
 same => n(unavailable),VoiceMail(1002@default,u)
 same => n,Hangup()

[cfc-entry]
; The way into a call flow control from an inbound route, a menu or anything else that
; names one: by code, on to the switch's own context. Not [internal], where the
; code flips the switch instead.
exten => *28,1,Goto(cfc-1,s,1)
exten => *271,1,Goto(cfc-2,s,1)

[cfc-1]
; Night mode: normal or override, reached by the Goto on *28 in [cfc-entry].
; Which way is read from astdb at call time, so dialling *28 takes effect on the next call.
exten => s,1,NoOp(Call flow control *28 Night mode)
 same => n,GotoIf($["${DB(TNPBX/CFC/1)}" = "1"]?override)
 same => n,NoOp(Call flow control *28 normal to Extension:1001)
 same => n,Goto(internal,1001,1)
 same => n(override),NoOp(Call flow control *28 override to Voicemail:1002)
 same => n,VoiceMail(1002@default,u)
 same => n,Hangup()

[cfc-2]
; Lunch: normal or override, reached by the Goto on *271 in [cfc-entry].
; Which way is read from astdb at call time, so dialling *271 takes effect on the next call.
exten => s,1,NoOp(Call flow control *271 Lunch)
 same => n,GotoIf($["${DB(TNPBX/CFC/2)}" = "1"]?override)
 same => n,NoOp(Call flow control *271 normal to Extension:1002)
 same => n,Goto(internal,1002,1)
 same => n(override),NoOp(Call flow control *271 override to CallFlowControl:*28)
 same => n,Goto(cfc-entry,*28,1)
