[internal]
; Echo test
exten => *43,1,Answer()
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Hangup()

; Check your own voicemail
exten => *97,1,Answer()
 same => n,VoiceMailMain(${CALLERID(num)}@default,s)
 same => n,Hangup()

; Directed call pickup: the code above followed by the extension that is ringing
exten => _*8.,1,Pickup(${EXTEN:2}@internal)
 same => n,Hangup()

; Hold music for a call that started on a phone here. Each extension below names
; the class that ships on the caller's channel before it dials, and only when
; Asterisk still has its own default sitting there: a class an inbound route
; already chose for this caller is theirs, and is left alone (D122 amended).
; The U(sub-setmoh) on each Dial does the same for the channel it creates,
; which is the one that is held when the caller is the one pressing hold.

; Front Desk
exten => 1001,hint,PJSIP/1001
exten => 1001,1,ExecIf($["${CHANNEL(musicclass)}" = "" | "${CHANNEL(musicclass)}" = "default"]?Set(CHANNEL(musicclass)=Standard))
 same => n,Dial(PJSIP/1001,30,tTkKU(sub-setmoh))
 same => n,Hangup()

; Sales
exten => 1002,hint,PJSIP/1002
exten => 1002,1,ExecIf($["${CHANNEL(musicclass)}" = "" | "${CHANNEL(musicclass)}" = "default"]?Set(CHANNEL(musicclass)=Standard))
 same => n,Dial(PJSIP/1002,30,tTkKU(sub-setmoh))
 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?busy:unavailable)
 same => n(busy),VoiceMail(1002@default,b)
 same => n,Hangup()
 same => n(unavailable),VoiceMail(1002@default,u)
 same => n,Hangup()

[sub-setmoh]
; Run by the U() option on every Dial above, on the channel that Dial creates, as
; it answers. That channel never executes dialplan of its own, so this is the only
; place a hold class can be named on it - and it is the channel that gets held when
; the caller is the one pressing hold. Same guard as the caller's own line: fill in
; only where Asterisk still has its own default sitting there (D122 amended).
exten => s,1,ExecIf($["${CHANNEL(musicclass)}" = "" | "${CHANNEL(musicclass)}" = "default"]?Set(CHANNEL(musicclass)=Standard))
 same => n,Return()

[from-trunk-callcentric]
; Inbound calls from the callcentric trunk
; The provider puts the account user in the request URI and the DID in the To
; header (verified on the wire, matching Callcentric's DID-routing guide), so
; every call lands on one pattern and is dispatched by the number it was sent to.
exten => _X.,1,Set(DID=${CUT(CUT(PJSIP_HEADER(read,To),@,1),:,2)})
 same => n,NoOp(Inbound ${DID} on callcentric)
 same => n,GotoIf($["${DID}" = "17771234567"]?r1)
 same => n,GotoIf($["${DID}" = "17771234568"]?r2)
 same => n(none),NoOp(Inbound catch-all on callcentric to Extension:1002)
 same => n,Set(CHANNEL(musicclass)=Standard)
 same => n,Goto(internal,1002,1)
 same => n(r1),NoOp(Inbound 17771234567 on callcentric to Extension:1001)
 same => n,Set(CHANNEL(musicclass)=Front Desk)
 same => n,Goto(internal,1001,1)
 same => n(r2),NoOp(Inbound 17771234568 on callcentric to Voicemail:1002)
 same => n,VoiceMail(1002@default,u)
 same => n,Hangup()

[from-trunk-ip-provider]
; Inbound calls from the ip-provider trunk
; The provider puts the account user in the request URI and the DID in the To
; header (verified on the wire, matching Callcentric's DID-routing guide), so
; every call lands on one pattern and is dispatched by the number it was sent to.
exten => _X.,1,Set(DID=${CUT(CUT(PJSIP_HEADER(read,To),@,1),:,2)})
 same => n,NoOp(Inbound ${DID} on ip-provider)
 same => n(none),NoOp(No inbound route for ${DID} on ip-provider)
 same => n,Hangup()
