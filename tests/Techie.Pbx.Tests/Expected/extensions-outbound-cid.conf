[internal]
; Echo test
exten => *43,1,Answer()
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Hangup()

; Directed call pickup: the code above followed by the extension that is ringing
exten => _*8.,1,Pickup(${EXTEN:2}@internal)
 same => n,Hangup()

; Front Desk
exten => 1001,hint,PJSIP/1001
exten => 1001,1,Dial(PJSIP/1001,30,tTkKr)
 same => n,Hangup()

; Sales
exten => 1002,hint,PJSIP/1002
exten => 1002,1,Dial(PJSIP/1002,30,tTkKr)
 same => n,Hangup()

; Calls to the outside world, tried in the order the routes are listed
include => outbound

[from-trunk-callcentric]
; Inbound calls from the callcentric trunk
; The provider puts the account user in the request URI and the DID in the To
; header (verified on the wire, matching Callcentric's DID-routing guide), so
; every call lands on one pattern and is dispatched by the number it was sent to.
exten => _X.,1,Set(DID=${CUT(CUT(PJSIP_HEADER(read,To),@,1),:,2)})
 same => n,NoOp(Inbound ${DID} on callcentric)
 same => n(none),NoOp(No inbound route for ${DID} on callcentric)
 same => n,Hangup()

[outbound]
include => outbound-local
include => outbound-long-distance
include => outbound-blocked

[outbound-local]
; local (10) out over callcentric
; Caller ID: this route's own, and only where the extension that dialled claimed
; none of its own. Trunk < route < extension, and the trunk's callerid in
; pjsip.conf is what is left when neither named one (D125).
exten => _NXXXXXX,1,ExecIf($["${TNPBX_CID}" != ""]?Set(CALLERID(all)=${TNPBX_CID}))
 same => n,ExecIf($["${TNPBX_CID}" = ""]?Set(CALLERID(all)="Acme Sales" <17771234567>))
 same => n,Set(CHANNEL(musicclass)=Front Desk)
 same => n,Dial(PJSIP/callcentric/sip:1714${EXTEN}@callcentric.com,60,tTkK)
 same => n,Hangup()

[outbound-long-distance]
; long-distance (20) out over callcentric
; Caller ID: whatever the extension that dialled claimed, if it claimed anything.
; This route names none, so everyone else goes out as the trunk's callerid (D125).
exten => _1NXXXXXXXXX,1,ExecIf($["${TNPBX_CID}" != ""]?Set(CALLERID(all)=${TNPBX_CID}))
 same => n,Dial(PJSIP/callcentric/sip:${EXTEN}@callcentric.com,60,tTkK)
 same => n,Hangup()

[outbound-blocked]
; No route matched, so the call does not go out. Toll fraud starts with a
; number nobody meant to allow, so unmatched numbers fail here on purpose.
exten => _X.,1,NoOp(No outbound route for ${EXTEN})
 same => n,Playback(ss-noservice)
 same => n,Hangup()
