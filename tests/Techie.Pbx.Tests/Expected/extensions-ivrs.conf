; Generated by TNPBX. Do not edit: changes will be overwritten.

[internal]
; Echo test
exten => *43,1,Answer()
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Hangup()

; Check your own voicemail
exten => *97,1,Answer()
 same => n,VoiceMailMain(${CALLERID(num)}@default,s)
 same => n,Hangup()

; Directed call pickup: the code above followed by the extension that is ringing
exten => _*8.,1,Pickup(${EXTEN:2}@internal)
 same => n,Hangup()

; Front Desk
exten => 1001,hint,PJSIP/1001
exten => 1001,1,Dial(PJSIP/1001,30,tTkKr)
 same => n,Hangup()

; Sales
exten => 1002,hint,PJSIP/1002
exten => 1002,1,Dial(PJSIP/1002,30,tTkKr)
 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?busy:unavailable)
 same => n(busy),VoiceMail(1002@default,b)
 same => n,Hangup()
 same => n(unavailable),VoiceMail(1002@default,u)
 same => n,Hangup()

; Welcome message
; Played to callers before the menu
exten => 700,1,Answer()
 same => n,Playback(tnpbx/announcements/1/welcome-message)
 same => n,Hangup()

; Main menu (menu)
; Daytime auto attendant
exten => 500,1,Goto(ivr-1,s,1)

; After hours (menu)
exten => 501,1,Goto(ivr-2,s,1)

[ivr-1]
; Main menu: the menu itself, reached by the Goto on 500 in [internal].
; Nothing is included here, so a caller can never fall through to a route out.
exten => s,1,Answer()
 same => n,Set(TIMEOUT(digit)=10)
 same => n,Set(IVR_RETRIES=0)
 same => n(start),Background(tnpbx/announcements/2/menu-greeting)
 same => n,WaitExten(10)
 same => n,Goto(t,1)

exten => 0,1,NoOp(IVR 500 key 0 to Voicemail:1002)
 same => n,VoiceMail(1002@default,u)
 same => n,Hangup()

exten => 1,1,NoOp(IVR 500 key 1 to Extension:1001)
 same => n,Goto(internal,1001,1)

exten => 2,1,NoOp(IVR 500 key 2 to Extension:1002)
 same => n,Goto(internal,1002,1)

exten => 9,1,NoOp(IVR 500 key 9 to Ivr:501)
 same => n,Goto(internal,501,1)

exten => *,1,NoOp(IVR 500 key * to Hangup)
 same => n,Hangup()

; Dial an extension straight from the menu. One entry each rather than a
; pattern, as in the internal context, so only numbers that exist can be
; reached from here (D12, D60).
exten => 1001,1,Goto(internal,1001,1)
exten => 1002,1,Goto(internal,1002,1)

; Nothing was pressed in time
exten => t,1,NoOp(IVR 500 timed out)
 same => n,Set(IVR_RETRIES=$[${IVR_RETRIES} + 1])
 same => n,GotoIf($[${IVR_RETRIES} > 3]?final,1)
 same => n,Goto(s,start)

; A key with nothing behind it: every digit the menu does not use lands here
exten => i,1,NoOp(IVR 500 invalid entry ${EXTEN})
 same => n,Set(IVR_RETRIES=$[${IVR_RETRIES} + 1])
 same => n,GotoIf($[${IVR_RETRIES} > 3]?final,1)
 same => n,Playback(invalid)
 same => n,Goto(s,start)

; Out of retries, so the call goes where the menu says it should
exten => final,1,NoOp(IVR 500 giving up to Voicemail:1002)
 same => n,VoiceMail(1002@default,u)
 same => n,Hangup()

[ivr-2]
; After hours: the menu itself, reached by the Goto on 501 in [internal].
; Nothing is included here, so a caller can never fall through to a route out.
exten => s,1,Answer()
 same => n,Set(TIMEOUT(digit)=5)
 same => n,Set(IVR_RETRIES=0)
 same => n(start),Background(tnpbx/announcements/3/after-hours)
 same => n,WaitExten(5)
 same => n,Goto(t,1)

exten => 1,1,NoOp(IVR 501 key 1 to Voicemail:1002)
 same => n,VoiceMail(1002@default,u)
 same => n,Hangup()

; Nothing was pressed in time
exten => t,1,NoOp(IVR 501 timed out)
 same => n,Set(IVR_RETRIES=$[${IVR_RETRIES} + 1])
 same => n,GotoIf($[${IVR_RETRIES} > 0]?final,1)
 same => n,Goto(s,start)

; A key with nothing behind it: every digit the menu does not use lands here
exten => i,1,NoOp(IVR 501 invalid entry ${EXTEN})
 same => n,Set(IVR_RETRIES=$[${IVR_RETRIES} + 1])
 same => n,GotoIf($[${IVR_RETRIES} > 0]?final,1)
 same => n,Playback(invalid)
 same => n,Goto(s,start)

; Out of retries, so the call goes where the menu says it should
exten => final,1,NoOp(IVR 501 giving up to Hangup)
