[general]
parkeddynamic = no

[default]
; Slots 1 to 9. No parkext: the slot extensions are written into the
; generated dialplan one at a time, like every other number here (D119).
context => parkedcalls
parkpos => 1-9
findslot => first
parkingtime => 60
comebacktoorigin = yes
comebackdialtime = 30

; No parkedmusicclass, which is how a parked caller gets silence: Asterisk's
; holding bridge always tries music on hold first, and falls back to a silence
; generator when there is no class to start. The generated musiconhold.conf
; never defines a class called 'default', so there is nothing to find (D119).
